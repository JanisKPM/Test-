<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Lernmappe</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: feste Seitenleiste mit Fächern, rechts der Arbeitsbereich (Fach → Mappe → Eintrag) */
:root{
  --bg:#f4f5f8;--panel:#ffffff;--panel2:#eef0f5;--text:#1b2130;--muted:#677087;--line:#dfe3ec;
  --accent:#3b63d9;--accent-soft:#e6ecfc;--danger:#cf3f3f;--ok:#278a52;--warn:#d98b12;--ai:#7a4fd6;--ai-soft:#f0eafd;
  --mark:#ffe46b;--shadow:0 1px 3px rgba(20,30,60,.07);--ok-soft:#e3f4ea;--danger-soft:#fbe7e7;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#13161c;--panel:#1b1f27;--panel2:#252a35;--text:#e5e8ef;--muted:#949cb0;--line:#2f3542;
    --accent:#6f91f0;--accent-soft:#232c45;--danger:#ef6b6b;--ok:#4cc27e;--warn:#f0a83a;--ai:#a988f2;--ai-soft:#2a2340;
    --mark:#b89a1c;--shadow:none;--ok-soft:#1d3327;--danger-soft:#3a2224;color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#13161c;--panel:#1b1f27;--panel2:#252a35;--text:#e5e8ef;--muted:#949cb0;--line:#2f3542;
  --accent:#6f91f0;--accent-soft:#232c45;--danger:#ef6b6b;--ok:#4cc27e;--warn:#f0a83a;--ai:#a988f2;--ai-soft:#2a2340;
  --mark:#b89a1c;--shadow:none;--ok-soft:#1d3327;--danger-soft:#3a2224;color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.app{display:grid;grid-template-columns:250px 1fr;height:100%}
/* Seitenleiste */
aside{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;overflow:auto}
.brand{padding:18px 18px 10px;font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;cursor:pointer;border:0;background:none;text-align:left}
.search{margin:6px 14px 10px}
.search input{width:100%;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel2)}
.navlabel{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);padding:10px 18px 4px}
.nav button{display:flex;align-items:center;gap:10px;width:100%;border:0;background:none;padding:8px 18px;text-align:left}
.nav button:hover{background:var(--panel2)}
.nav button.active{background:var(--panel2);font-weight:600}
.nav .cd-mini{margin-left:auto;font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.dot{width:10px;height:10px;border-radius:3px;flex:none;display:inline-block}
.tag{font-size:10.5px;font-weight:700;padding:1px 6px;border-radius:5px;background:var(--panel2);color:var(--muted);border:1px solid var(--line)}
.nav .tag{margin-left:auto}.nav .cd-mini + .tag{margin-left:6px}
.sidefoot{margin-top:auto;padding:12px 14px;display:flex;gap:6px;flex-wrap:wrap;border-top:1px solid var(--line);align-items:center}
.sync{font-size:12px;color:var(--muted);width:100%}
/* Hauptbereich */
main{overflow:auto;padding-block:24px 60px;padding-left:max(32px, env(safe-area-inset-left, 0px));padding-right:max(32px, env(safe-area-inset-right, 0px));min-width:0}
.crumbs{color:var(--muted);font-size:13px;margin-bottom:6px;display:flex;gap:6px;flex-wrap:wrap}
.crumbs a{color:var(--muted);cursor:pointer;text-decoration:none}
.crumbs a:hover{color:var(--accent)}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:20px}
.head h1{font-size:24px;margin:0;flex:1;min-width:180px;text-wrap:balance}
h2.sec{font-size:17px;margin:32px 0 12px;display:flex;align-items:center;gap:10px}
h2.sec .btn{margin-left:auto}
.btn{border:1px solid var(--line);background:var(--panel);padding:7px 12px;border-radius:8px;box-shadow:var(--shadow);white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn:disabled{opacity:.5;cursor:default}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.ai{background:var(--ai-soft);border-color:var(--ai);color:var(--ai);font-weight:600}
.btn.ai:hover{background:var(--ai);color:#fff}
.btn.danger{color:var(--danger)}
.btn.small{padding:4px 9px;font-size:13px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px;cursor:pointer;box-shadow:var(--shadow);position:relative;transition:transform .08s;min-width:0}
.card:hover{transform:translateY(-2px);border-color:var(--c,var(--accent))}
.card .bar{position:absolute;left:0;top:0;bottom:0;width:5px;border-radius:12px 0 0 12px;background:var(--c,var(--accent))}
.card h3{margin:0 0 4px;font-size:16px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.card .meta{color:var(--muted);font-size:13px}
.card .examline{margin-top:8px;font-size:12.5px;font-weight:600;font-variant-numeric:tabular-nums}
.folder-ic{font-size:26px;line-height:1;margin-bottom:8px}
.list{display:flex;flex-direction:column;gap:8px}
.row{display:flex;align-items:center;gap:12px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:11px 14px;cursor:pointer;min-width:0}
.row:hover{border-color:var(--accent)}
.row .ic{font-size:20px}
.row .t{flex:1;min-width:0}
.row .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row .t small{color:var(--muted)}
.empty{color:var(--muted);text-align:center;padding:40px 20px;border:2px dashed var(--line);border-radius:12px}
.tabs{display:flex;gap:4px;margin-bottom:14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.tabs button{border:0;background:none;padding:8px 14px;border-bottom:2px solid transparent;color:var(--muted)}
.tabs button.on{color:var(--text);border-color:var(--accent);font-weight:600}
/* Prüfungs-Countdown */
.exams{display:grid;grid-template-columns:minmax(0,1.3fr) minmax(0,1fr);gap:14px}
.next{background:var(--panel);border:1px solid var(--line);border-left:6px solid var(--c);border-radius:14px;padding:20px 22px;box-shadow:var(--shadow);cursor:pointer;min-width:0}
.next .lbl{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.next .subj{font-size:21px;font-weight:700;margin:2px 0 2px}
.next .when{color:var(--muted);font-size:13.5px}
.clock{display:flex;gap:10px;margin-top:14px;flex-wrap:wrap}
.clock div{background:var(--panel2);border-radius:10px;padding:8px 10px;min-width:64px;text-align:center}
.clock b{display:block;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.clock span{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.urg-hi{color:var(--danger)}.urg-mid{color:var(--warn)}.urg-lo{color:var(--ok)}
.exlist{display:flex;flex-direction:column;gap:8px;min-width:0}
.exrow{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;cursor:pointer;min-width:0}
.exrow .nm{flex:1;min-width:0}
.exrow .nm small{display:block;color:var(--muted);font-size:12.5px}
.exrow .left{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;white-space:nowrap}
.exrow.past{opacity:.55}
.banner{display:flex;align-items:center;gap:12px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c);border-radius:10px;padding:10px 14px;margin-bottom:18px;font-variant-numeric:tabular-nums}
.examtable{display:flex;flex-direction:column;gap:8px}
.examtable .exrow{cursor:default}
/* Editor */
.title-in{font-size:22px;font-weight:700;border:0;background:none;padding:4px 0;outline:none;flex:1;min-width:160px}
.editor{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:16px}
.editor textarea{width:100%;min-height:60vh;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:14px;resize:vertical;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px}
.editor textarea[readonly]{opacity:.8}
.preview{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:14px 20px;min-height:60vh;overflow:auto;min-width:0}
.md h1,.md h2,.md h3{margin:.8em 0 .3em;text-wrap:balance}
.md h1{font-size:22px;border-bottom:2px solid var(--c,var(--accent));padding-bottom:4px}
.md h2{font-size:18px;color:var(--c,var(--accent))}
.md h3{font-size:16px}
.md mark{background:var(--mark);color:inherit;padding:0 2px;border-radius:3px}
.md code{background:var(--panel2);padding:1px 5px;border-radius:4px;font-size:13px}
.merke{border-left:4px solid var(--warn);background:var(--panel2);padding:8px 12px;border-radius:0 8px 8px 0;margin:8px 0}
.merke::before{content:"💡 Merke: ";font-weight:700}
.tbl{overflow-x:auto}
.md table{border-collapse:collapse;margin:8px 0}
.md td,.md th{border:1px solid var(--line);padding:4px 10px;text-align:left;vertical-align:top}
.md th{background:var(--panel2)}
/* Ansicht wie ein gedrucktes Blatt (immer hell, wie ein PDF) */
.paper-wrap{background:var(--panel2);border:1px solid var(--line);border-radius:12px;padding:28px 16px;overflow-x:auto}
.paper{--panel2:#eef0f5;--line:#d9dde6;--text:#1b2130;--muted:#677087;--mark:#ffe46b;--warn:#d98b12;color-scheme:light;
  background:#fff;color:#1b2130;max-width:210mm;min-height:60vh;margin:0 auto;padding:18mm 18mm 20mm;box-shadow:0 4px 24px rgba(20,30,60,.14);border-radius:3px;font-size:15.5px;line-height:1.6}
.paper-meta{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;font-size:12px;color:#677087;border-bottom:1px solid #d9dde6;padding-bottom:6px;margin-bottom:6px}
.paper .md > h1:first-child{margin-top:.4em}
.paper.pdfmode{box-shadow:none;border-radius:0;padding:0;max-width:none;min-height:0;font-size:14px}
.notebar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:14px;border-bottom:1px solid var(--line)}
.notebar .tabs{border:0;margin:0}
.notebar .btn{margin-left:auto;margin-bottom:6px}
.hint{color:var(--muted);font-size:12.5px;margin-top:6px}
.saved{color:var(--ok);font-size:13px}
/* KI */
.aibar{display:flex;gap:8px;flex-wrap:wrap;align-items:center;background:var(--ai-soft);border:1px solid var(--line);border-radius:10px;padding:8px 10px;margin-bottom:14px}
.aibar .lbl{font-weight:700;color:var(--ai);font-size:13.5px;margin-right:4px}
.aistatus{display:flex;gap:10px;align-items:center;background:var(--ai-soft);color:var(--ai);border:1px solid var(--ai);border-radius:10px;padding:8px 12px;margin-bottom:14px;font-weight:600}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}.card{transition:none}}
.askbox{display:flex;gap:8px;margin-top:10px}
.askbox input{flex:1;min-width:0;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
.answer{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 16px;margin-top:10px}
/* Karteikarten */
.qa{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(0,1fr) 34px;gap:8px;align-items:start;margin-bottom:8px}
.qa textarea{width:100%;min-height:54px;border:1px solid var(--line);border-radius:8px;background:var(--panel);padding:8px;resize:vertical}
.qa .n{color:var(--muted);padding-top:8px;text-align:right}
.learn{max-width:640px;margin:0 auto;text-align:center}
.flip{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c,var(--accent));border-radius:14px;min-height:240px;padding:30px;display:flex;flex-direction:column;justify-content:center;font-size:19px;cursor:pointer;box-shadow:var(--shadow);white-space:pre-wrap}
.flip small{color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:10px}
.progress{height:6px;background:var(--panel2);border-radius:3px;margin:14px 0;overflow:hidden}
.progress div{height:100%;background:var(--c,var(--accent))}
.learn .actions{display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:10px;background:var(--panel2);color:var(--muted)}
/* Dialoge & Hinweise */
.modal-bg{position:fixed;inset:0;background:rgba(10,15,30,.45);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
.modal{background:var(--panel);border-radius:12px;padding:20px;width:100%;max-width:460px;box-shadow:0 10px 40px rgba(0,0,0,.25);max-height:90vh;overflow:auto}
.modal h3{margin:0 0 12px}
.modal p{margin:0 0 14px;color:var(--muted)}
.modal label{display:block;font-size:13px;font-weight:600;margin-bottom:4px}
.modal input,.modal select,.modal textarea{width:100%;padding:9px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel2);margin-bottom:14px}
.modal textarea{min-height:110px;resize:vertical}
.modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;flex-wrap:wrap}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom, 0px));transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px);box-shadow:0 6px 20px rgba(0,0,0,.2)}
/* Dateien in Mappen */
.files{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:8px}
.file{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:9px 12px;min-width:0}
.file .ic{font-size:22px}
.file .t{flex:1;min-width:0;cursor:pointer}
.file .t b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:14px}
.file .t small{color:var(--muted);font-size:12px}
.file .acts{display:flex;gap:4px;flex:none}
.dropzone{border:2px dashed var(--line);border-radius:12px;padding:16px;text-align:center;color:var(--muted);margin-bottom:8px;cursor:pointer}
.dropzone:hover,.dropzone.over{border-color:var(--accent);background:var(--accent-soft);color:var(--text)}
.chk{display:flex;flex-direction:column;gap:6px;background:var(--panel2);border-radius:8px;padding:10px 12px;margin-bottom:14px;max-height:180px;overflow:auto}
.chk label{display:flex;gap:8px;align-items:center;font-weight:400;margin:0}
.modal .chk input{width:auto;margin:0}
.filetext{white-space:pre-wrap;background:var(--panel2);border-radius:8px;padding:10px 12px;max-height:50vh;overflow:auto;font-size:13.5px;margin-bottom:14px}
.modal img.prev{max-width:100%;border-radius:8px;margin-bottom:14px}
/* Quiz, Erklär-Modus, Probeklausur */
.quizcard{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--c,var(--accent));border-radius:14px;padding:22px;max-width:760px;margin:0 auto;box-shadow:var(--shadow)}
.quizcard .qtype{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin-bottom:6px}
.quizcard .qq{font-size:18px;font-weight:600;line-height:1.5}
.qopts{display:grid;gap:8px;margin-top:16px}
.qopt{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--panel)}
.qopt:hover:not(:disabled){border-color:var(--accent)}
.qopt b{color:var(--muted);min-width:18px}
.qopt.right{border-color:var(--ok);background:var(--ok-soft)}
.qopt.wrong{border-color:var(--danger);background:var(--danger-soft)}
.qopt:disabled{cursor:default;opacity:1}
.tfrow{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:16px}
.gaptext{font-size:17px;line-height:2.2}
.gapin{border:0;border-bottom:2px solid var(--accent);background:var(--panel2);padding:2px 6px;border-radius:4px;max-width:100%}
.gapin.right{border-color:var(--ok);background:var(--ok-soft)}
.gapin.wrong{border-color:var(--danger);background:var(--danger-soft)}
.sol{color:var(--ok);font-weight:700;margin:0 4px}
.fb{margin-top:16px;padding:10px 14px;border-radius:10px;background:var(--panel2);border-left:4px solid var(--muted)}
.fb.ok{border-color:var(--ok)}.fb.no{border-color:var(--danger)}
.qnav{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.qmeta{display:flex;justify-content:space-between;color:var(--muted);font-size:13px;max-width:760px;margin:0 auto 8px;gap:10px;flex-wrap:wrap}
.qwrap .progress{max-width:760px;margin:0 auto 10px}
.score-big{font-size:44px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.fbhead{display:flex;gap:18px;align-items:center;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:16px 0 10px}
.fbhead > div:last-child{flex:1;min-width:200px}
.fbgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:10px}
.fbbox{background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--k,var(--accent));border-radius:10px;padding:10px 14px;min-width:0}
.fbbox h4{margin:0 0 6px;font-size:14px}
.fbbox ul{margin:0;padding-left:18px}
.fbbox li{margin-bottom:3px}
.explain textarea,.task textarea.ans{width:100%;min-height:200px;border:1px solid var(--line);border-radius:10px;background:var(--panel);padding:12px 14px;resize:vertical;line-height:1.55}
.explain select{width:100%;max-width:520px;padding:8px 10px;border:1px solid var(--line);border-radius:8px;background:var(--panel);margin-bottom:12px}
.explain label{display:block;font-weight:600;font-size:13px;margin:14px 0 4px}
.toolrow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.toolrow .grow{flex:1}
.examtimer{position:sticky;top:env(safe-area-inset-top, 0px);z-index:5;display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:16px;box-shadow:0 4px 14px rgba(20,30,60,.08)}
.examtimer b{font-size:24px;font-variant-numeric:tabular-nums}
.task{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:14px;min-width:0}
.task .th{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-bottom:4px}
.task .md p:first-child{margin-top:0}
.thumbs{display:flex;gap:8px;flex-wrap:wrap}
.thumbs span{position:relative}
.thumbs img{height:72px;border-radius:6px;border:1px solid var(--line);display:block}
.thumbs button{position:absolute;top:-6px;right:-6px;border-radius:50%;width:22px;height:22px;padding:0;border:1px solid var(--line);background:var(--panel);font-size:12px}
.intro{background:var(--panel);border:1px solid var(--line);border-left:5px solid var(--c,var(--accent));border-radius:12px;padding:18px 20px;max-width:760px}
.intro ul{padding-left:20px}
details{margin-top:8px}
details summary{cursor:pointer;color:var(--accent);font-size:14px}
.menu-toggle{display:none}
@media (max-width:860px){
  .app{grid-template-columns:1fr}
  aside{position:fixed;inset:0 25% 0 0;z-index:15;transform:translateX(-100%);transition:transform .2s;padding-top:env(safe-area-inset-top, 0px)}
  aside.open{transform:none}
  .menu-toggle{display:inline-block}
  main{padding-block:16px 60px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
  .editor,.exams{grid-template-columns:minmax(0,1fr)}
  .paper-wrap{padding:10px 8px}.paper{padding:22px 18px;font-size:15px}
  .qa{grid-template-columns:minmax(0,1fr) minmax(0,1fr) 34px}.qa .n{display:none}
  .clock div{min-width:56px}.clock b{font-size:22px}
}
@media print{aside,.head .btn,.tabs,.crumbs,.no-print{display:none!important}.app{display:block}main{overflow:visible}.editor{display:block}.editor textarea{display:none}.preview{border:0}.paper-wrap{background:none;border:0;padding:0}.paper{box-shadow:none;padding:0;max-width:none}}
</style>
</head>
<body>
<div class="app">
  <aside id="side"></aside>
  <main id="main"></main>
</div>
<input type="file" id="importFile" accept=".json" hidden>
<script>
/* =========================================================
   Daten
   ========================================================= */
const KEY = 'lernmappe-v1';
const DEFAULT_SUBJECTS = [
  {name:'Geschichte', kind:'LK', color:'#b5651d', icon:'🏛️'},
  {name:'Politik',    kind:'LK', color:'#3b6fe0', icon:'⚖️'},
  {name:'Englisch',   kind:'LK', color:'#c0392b', icon:'🇬🇧'},
  {name:'Mathe',      kind:'P4', color:'#8e44ad', icon:'📐'},
  {name:'Deutsch',    kind:'P5', color:'#c99a12', icon:'📖'},
  {name:'Biologie',   kind:'',   color:'#2f9e5b', icon:'🧬'},
  {name:'Sport',      kind:'',   color:'#e67e22', icon:'🏃'},
  {name:'Kunst',      kind:'',   color:'#d63384', icon:'🎨'},
];
const DEFAULT_EXAMS = [
  ['Englisch',   '2026-11-11T08:00'],
  ['Geschichte', '2026-11-16T08:00'],
  ['Politik',    '2026-11-20T08:00'],
  ['Mathe',      '2026-11-24T08:00'],
];
const uid = () => Math.random().toString(36).slice(2,10) + Date.now().toString(36).slice(-4);

function migrate(st){
  if(!st || !Array.isArray(st.subjects)) st = {subjects: DEFAULT_SUBJECTS.map(s => ({id:uid(), ...s, folders:[]}))};
  if(!Array.isArray(st.exams)){
    st.exams = DEFAULT_EXAMS.map(([name, at]) => {
      const s = st.subjects.find(x => x.name === name);
      return s ? {id:uid(), subjectId:s.id, at, note:'Klausur'} : null;
    }).filter(Boolean);
  }
  st.subjects.forEach(s => s.folders.forEach(f => { if(!Array.isArray(f.files)) f.files = []; }));
  return st;
}
let state;
try { state = JSON.parse(localStorage.getItem(KEY)); } catch(e){ state = null; }
state = migrate(state);

let localWarned = false;
function saveLocal(){
  try { localStorage.setItem(KEY, JSON.stringify(state)); }
  catch(e){ if(!localWarned && !cloud.on){ localWarned = true; toast('Speichern im Browser nicht möglich – bitte über „Export“ sichern.'); } }
}
function save(){ state.savedAt = Date.now(); saveLocal(); cloud.queue(); }

/* ---------- Cloud-Speicher (nur in der Claude-Version) ----------
   Speichert den ganzen Stand privat pro Person, aufgeteilt in Stücke,
   damit auch große Lernzettel-Sammlungen Platz haben. */
const cloud = {
  on:false, col:null, sent:[], busy:false, again:false, timer:null, status:'',
  async init(){
    if(!window.claude?.use) return;
    const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    if(!db || !user) { this.setStatus(''); return; }
    try{
      const id = await user.id(); if(!id) return;
      this.col = db.collection('data/users/' + id);
      this.setStatus('Verbinde…');
      const meta = await withTimeout(this.col.doc('meta').get(), 10000);
      if(meta.exists){
        const m = meta.data();
        const parts = await withTimeout(Promise.all(Array.from({length:m.n}, (_,k) => this.col.doc('c'+k).get())), 15000);
        this.sent = parts.map(p => p.data()?.s ?? '');
        const remote = migrate(JSON.parse(this.sent.join('')));
        this.on = true;
        if((remote.savedAt||0) >= (state.savedAt||0)){ state = remote; saveLocal(); render(); }
        else this.push();
      } else { this.on = true; this.push(); }
      this.setStatus('☁️ Gespeichert in deinem Claude-Konto');
    } catch(e){ this.on = false; this.setStatus('⚠️ Cloud nicht erreichbar – nur lokal gespeichert'); }
  },
  queue(){ if(!this.on) return; clearTimeout(this.timer); this.setStatus('☁️ Speichert…'); this.timer = setTimeout(() => this.push(), 1500); },
  async push(){
    if(!this.col) return;
    if(this.busy){ this.again = true; return; }
    this.busy = true;
    try{
      const json = JSON.stringify(state), SIZE = 60000, parts = [];
      for(let k = 0; k < json.length; k += SIZE) parts.push(json.slice(k, k + SIZE));
      for(let k = 0; k < parts.length; k++) if(parts[k] !== this.sent[k]) await this.col.doc('c'+k).set({s:parts[k]});
      await this.col.doc('meta').set({n:parts.length, savedAt:state.savedAt||Date.now()});
      for(let k = parts.length; k < this.sent.length; k++) await this.col.doc('c'+k).delete();
      this.sent = parts;
      this.setStatus('☁️ Gespeichert in deinem Claude-Konto');
    } catch(e){ this.setStatus('⚠️ Cloud-Speichern fehlgeschlagen – lokal gesichert'); }
    finally{ this.busy = false; if(this.again){ this.again = false; this.push(); } }
  },
  setStatus(t){ this.status = t; const el = document.getElementById('sync'); if(el) el.textContent = t || '💾 Lokal im Browser gespeichert'; }
};
function withTimeout(p, ms){ return Promise.race([p, new Promise((_, rej) => setTimeout(() => rej(new Error('timeout')), ms))]); }

/* ---------- KI (nur in der Claude-Version verfügbar) ---------- */
let sample = null, downloads = null, assets = null, imgLimits = null;
const inClaude = !!window.claude?.use;
if(inClaude){
  window.claude.use('sample').then(async s => { sample = s; imgLimits = s ? (await s.limits().catch(() => null))?.images || null : null; render(); });
  window.claude.use('downloads').then(d => { downloads = d; });
  window.claude.use('assets').then(a => { assets = a; render(); });
}

/* =========================================================
   Hilfsfunktionen
   ========================================================= */
let route = {view:'home'};
let query = '';
const $ = s => document.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const getS = id => state.subjects.find(s => s.id === id);
const getF = (s,id) => s?.folders.find(f => f.id === id);
const getI = (f,id) => f?.items.find(i => i.id === id);
const fmtDate = t => new Date(t).toLocaleDateString('de-DE',{day:'2-digit',month:'2-digit',year:'numeric'});
const fmtExam = at => new Date(at).toLocaleString('de-DE',{weekday:'short',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}) + ' Uhr';
const kindLabel = s => s.kind ? s.kind + ' ' : '';
const filled = i => i.cards.filter(c => (c.q||'').trim() || (c.a||'').trim());
const countItems = s => s.folders.reduce((n,f) => n + f.items.length, 0);
function go(r){ route = r; $('#side').classList.remove('open'); render(); $('#main').scrollTop = 0; }
function curItem(){ const s = getS(route.s), f = getF(s, route.f); return getI(f, route.i); }

/* ---------- Markdown-Light ---------- */
function inline(t){
  return t
    .replace(/`([^`]+)`/g,'<code>$1</code>')
    .replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>')
    .replace(/\*([^*]+)\*/g,'<em>$1</em>')
    .replace(/==([^=]+)==/g,'<mark>$1</mark>')
    .replace(/__([^_]+)__/g,'<u>$1</u>');
}
function md(src){
  const lines = esc(src).split('\n'); let out = '', list = null, table = null;
  const closeList = () => { if(list){ out += `</${list}>`; list = null; } };
  const closeTable = () => { if(table){ out += '</table></div>'; table = null; } };
  for(const raw of lines){
    const l = raw.trimEnd(); let m;
    if(/^\s*\|.*\|$/.test(l)){
      if(/^\s*\|[\s\-:|]+\|$/.test(l)) continue;
      closeList();
      const cells = l.trim().slice(1,-1).split('|').map(c => inline(c.trim()));
      if(!table){ table = true; out += '<div class="tbl"><table><tr>' + cells.map(c=>`<th>${c}</th>`).join('') + '</tr>'; }
      else out += '<tr>' + cells.map(c=>`<td>${c}</td>`).join('') + '</tr>';
      continue;
    }
    closeTable();
    if((m = l.match(/^(#{1,3})\s+(.*)/))){ closeList(); out += `<h${m[1].length}>${inline(m[2])}</h${m[1].length}>`; }
    else if((m = l.match(/^&gt;\s?(.*)/))){ closeList(); out += `<div class="merke">${inline(m[1])}</div>`; }
    else if((m = l.match(/^\s*[-*•]\s+(.*)/))){ if(list!=='ul'){ closeList(); out += '<ul>'; list='ul'; } out += `<li>${inline(m[1])}</li>`; }
    else if((m = l.match(/^\s*\d+[.)]\s+(.*)/))){ if(list!=='ol'){ closeList(); out += '<ol>'; list='ol'; } out += `<li>${inline(m[1])}</li>`; }
    else if(l === '---'){ closeList(); out += '<hr>'; }
    else if(l === ''){ closeList(); }
    else { closeList(); out += `<p>${inline(l)}</p>`; }
  }
  closeList(); closeTable();
  return out;
}

/* ---------- Dialoge & Hinweise (statt alert/confirm) ---------- */
function toast(text, ms = 3500){
  document.querySelectorAll('.toast').forEach(x => x.remove());
  const t = document.createElement('div'); t.className = 'toast'; t.textContent = text;
  document.body.appendChild(t); setTimeout(() => t.remove(), ms);
}
function modal(title, body, okText = 'Speichern', {danger = false, wide = false} = {}){
  return new Promise(res => {
    const bg = document.createElement('div'); bg.className = 'modal-bg';
    bg.innerHTML = `<form class="modal" ${wide?'style="max-width:560px"':''}><h3>${esc(title)}</h3>${body}
      <div class="acts"><button type="button" class="btn" data-x>Abbrechen</button>
      <button type="submit" class="btn ${danger?'danger':'primary'}">${esc(okText)}</button></div></form>`;
    document.body.appendChild(bg);
    const form = bg.querySelector('form');
    const first = form.querySelector('input,select,textarea'); (first || form.querySelector('[type=submit]')).focus();
    if(first?.select && first.tagName === 'INPUT') first.select();
    const done = v => { bg.remove(); res(v); };
    form.onsubmit = e => { e.preventDefault(); done(Object.fromEntries(new FormData(form))); };
    bg.querySelector('[data-x]').onclick = () => done(null);
    bg.onclick = e => { if(e.target === bg) done(null); };
    form.onkeydown = e => { if(e.key === 'Escape') done(null); };
  });
}
async function ask(title, value = '', okText = 'Speichern'){
  const r = await modal(title, `<input name="v" id="m-v" value="${esc(value)}" required>`, okText);
  return r?.v?.trim() || null;
}
async function confirmBox(text, okText = 'Löschen'){
  return !!(await modal('Bist du sicher?', `<p>${esc(text)}</p>`, okText, {danger:true}));
}

/* =========================================================
   Prüfungs-Countdown
   ========================================================= */
function examsSorted(){
  return [...state.exams].sort((a,b) => new Date(a.at) - new Date(b.at));
}
function upcoming(){ const now = Date.now(); return examsSorted().filter(e => new Date(e.at) > now); }
function nextExamFor(sid){ return upcoming().find(e => e.subjectId === sid); }
function parts(ms){
  const s = Math.max(0, Math.floor(ms/1000));
  return {d: Math.floor(s/86400), h: Math.floor(s%86400/3600), m: Math.floor(s%3600/60), s: s%60};
}
function urg(ms){ return ms < 3*864e5 ? 'urg-hi' : ms < 7*864e5 ? 'urg-mid' : 'urg-lo'; }
function shortLeft(ms){
  if(ms <= 0) return 'vorbei';
  const p = parts(ms), pad = n => String(n).padStart(2,'0');
  if(p.d >= 2) return `${p.d} Tage ${p.h} Std`;
  if(p.d === 1) return `1 Tag ${p.h} Std`;
  return `${pad(p.h)}:${pad(p.m)}:${pad(p.s)}`;
}
function tick(){
  const now = Date.now();
  document.querySelectorAll('[data-exam-end]').forEach(el => {
    const ms = +el.dataset.examEnd - now, p = parts(ms), pad = n => String(n).padStart(2,'0');
    el.textContent = (p.d*24 + p.h ? (p.d*24 + p.h) + ':' : '') + pad(p.m) + ':' + pad(p.s);
    el.classList.toggle('urg-hi', ms < 5*60000);
    if(ms <= 0) submitExam(true);
  });
  document.querySelectorAll('[data-cd]').forEach(el => {
    const ms = new Date(el.dataset.cd) - now;
    if(el.dataset.mode === 'clock'){
      const p = parts(ms);
      el.innerHTML = [['Tage',p.d],['Std',p.h],['Min',p.m],['Sek',p.s]].map(([l,v]) => `<div><b>${String(v).padStart(2,'0')}</b><span>${l}</span></div>`).join('');
    } else {
      el.textContent = shortLeft(ms);
      el.classList.remove('urg-hi','urg-mid','urg-lo'); if(ms > 0) el.classList.add(urg(ms));
    }
  });
}
setInterval(tick, 1000);

function countdownBlock(){
  const up = upcoming();
  if(!up.length) return `<div class="empty">Keine anstehenden Prüfungen. <a href="#" onclick="go({view:'exams'});return false">Prüfung eintragen</a></div>`;
  const n = up[0], s = getS(n.subjectId) || {name:'?', color:'var(--accent)'};
  const rest = up.slice(1);
  return `<div class="exams">
    <div class="next" style="--c:${s.color}" onclick="go({view:'subject',s:'${s.id}'})">
      <div class="lbl">Nächste Prüfung</div>
      <div class="subj">${esc(kindLabel(s)+s.name)} ${n.note?`<span class="badge">${esc(n.note)}</span>`:''}</div>
      <div class="when">${fmtExam(n.at)}</div>
      <div class="clock" data-cd="${n.at}" data-mode="clock"></div>
    </div>
    <div class="exlist">${rest.length ? rest.map(e => examRow(e)).join('') : `<div class="empty" style="padding:20px">Danach keine weiteren Prüfungen eingetragen.</div>`}</div>
  </div>`;
}
function examRow(e, manage){
  const s = getS(e.subjectId) || {name:'(Fach gelöscht)', color:'#888', kind:''};
  const past = new Date(e.at) <= Date.now();
  return `<div class="exrow ${past?'past':''}" ${manage?'':`onclick="go({view:'subject',s:'${s.id}'})"`}>
    <span class="dot" style="background:${s.color}"></span>
    <div class="nm"><b>${esc(kindLabel(s)+s.name)}</b><small>${fmtExam(e.at)}${e.note?' · '+esc(e.note):''}</small></div>
    <span class="left" data-cd="${e.at}">${shortLeft(new Date(e.at) - Date.now())}</span>
    ${manage?`<button class="btn small" onclick="editExam('${e.id}')">Ändern</button><button class="btn small danger" onclick="deleteExam('${e.id}')" aria-label="Prüfung löschen">✕</button>`:''}
  </div>`;
}
function viewExams(){
  const all = examsSorted();
  return `${crumbs([['Fächer',{view:'home'}],['Prüfungen']])}
    <div class="head">${menuBtn}<h1>⏳ Prüfungen</h1><button class="btn primary" onclick="editExam()">＋ Prüfung eintragen</button></div>
    ${all.length ? `<div class="examtable">${all.map(e => examRow(e, true)).join('')}</div>` : `<div class="empty">Noch keine Prüfungen eingetragen.</div>`}`;
}
async function editExam(id){
  const e = id ? state.exams.find(x => x.id === id) : null;
  const r = await modal(e ? 'Prüfung ändern' : 'Prüfung eintragen', `
    <label for="ex-s">Fach</label>
    <select name="s" id="ex-s">${state.subjects.map(s => `<option value="${s.id}" ${e?.subjectId===s.id?'selected':''}>${esc(kindLabel(s)+s.name)}</option>`).join('')}</select>
    <div class="two"><div><label for="ex-d">Datum</label><input type="date" name="d" id="ex-d" required value="${e?e.at.slice(0,10):''}"></div>
    <div><label for="ex-t">Uhrzeit</label><input type="time" name="t" id="ex-t" required value="${e?e.at.slice(11,16):'08:00'}"></div></div>
    <label for="ex-n">Notiz (optional)</label><input name="n" id="ex-n" placeholder="z. B. Klausur Q2.1, mündliche Prüfung" value="${esc(e?.note||'Klausur')}">`);
  if(!r) return;
  const at = `${r.d}T${r.t}`;
  if(e) Object.assign(e, {subjectId:r.s, at, note:r.n.trim()});
  else state.exams.push({id:uid(), subjectId:r.s, at, note:r.n.trim()});
  save(); render(); toast('Prüfung gespeichert');
}
async function deleteExam(id){
  if(!await confirmBox('Diese Prüfung aus dem Countdown entfernen?', 'Entfernen')) return;
  state.exams = state.exams.filter(x => x.id !== id); save(); render();
}

/* =========================================================
   Seitenleiste
   ========================================================= */
function renderSide(){
  const cur = route.s;
  $('#side').innerHTML = `
    <button class="brand" onclick="go({view:'home'})"><span aria-hidden="true">📚</span> Lernmappe</button>
    <div class="search"><input id="q" placeholder="🔍 Alles durchsuchen…" value="${esc(query)}" aria-label="Suchen"></div>
    <div class="nav"><button class="${route.view==='exams'?'active':''}" onclick="go({view:'exams'})">⏳ Prüfungen</button></div>
    <div class="navlabel">Fächer</div>
    <div class="nav">
      ${state.subjects.map(s => { const ne = nextExamFor(s.id); return `
        <button class="${s.id===cur?'active':''}" onclick="go({view:'subject',s:'${s.id}'})">
          <span class="dot" style="background:${s.color}"></span>${esc(s.name)}
          ${ne?`<span class="cd-mini" title="Nächste Prüfung">${Math.max(0, Math.ceil((new Date(ne.at)-Date.now())/864e5))} T</span>`:''}
          ${s.kind?`<span class="tag">${s.kind}</span>`:''}
        </button>`; }).join('')}
    </div>
    <div class="sidefoot">
      <button class="btn small" onclick="exportData()" title="Alle Daten als Datei sichern">⬇ Export</button>
      <button class="btn small" onclick="$('#importFile').click()" title="Gesicherte Datei laden">⬆ Import</button>
      <button class="btn small" onclick="toggleTheme()" title="Hell/Dunkel" aria-label="Hell- oder Dunkelmodus">🌓</button>
      <div class="sync" id="sync">${esc(cloud.status || '💾 Lokal im Browser gespeichert')}</div>
    </div>`;
  const q = $('#q');
  q.oninput = () => { query = q.value; go(query.trim() ? {view:'search'} : {view:'home'}); const n = $('#q'); n.focus(); n.setSelectionRange(n.value.length, n.value.length); };
}

/* =========================================================
   Ansichten
   ========================================================= */
function crumbs(list){
  return `<div class="crumbs">${list.map(([t,r]) => r ? `<a onclick='go(${JSON.stringify(r)})'>${esc(t)}</a>` : `<span>${esc(t)}</span>`).join('<span>›</span>')}</div>`;
}
const menuBtn = `<button class="btn menu-toggle" onclick="$('#side').classList.toggle('open')" aria-label="Menü">☰</button>`;

function viewHome(){
  const recent = [];
  state.subjects.forEach(s => s.folders.forEach(f => f.items.forEach(i => recent.push({s,f,i}))));
  recent.sort((a,b) => b.i.updated - a.i.updated);
  return `
    <div class="head">${menuBtn}<h1>Meine Fächer</h1></div>
    ${countdownBlock()}
    <h2 class="sec">Fächer</h2>
    <div class="grid">
      ${state.subjects.map(s => { const ne = nextExamFor(s.id); return `
        <div class="card" style="--c:${s.color}" onclick="go({view:'subject',s:'${s.id}'})">
          <div class="bar"></div>
          <div class="folder-ic">${s.icon||'📁'}</div>
          <h3>${esc(s.name)} ${s.kind?`<span class="badge">${s.kind}</span>`:''}</h3>
          <div class="meta">${s.folders.length} Mappe${s.folders.length===1?'':'n'} · ${countItems(s)} Einträge</div>
          ${ne?`<div class="examline">⏳ Prüfung in <span data-cd="${ne.at}">${shortLeft(new Date(ne.at)-Date.now())}</span></div>`:''}
        </div>`; }).join('')}
    </div>
    <h2 class="sec">Zuletzt bearbeitet</h2>
    ${recent.length ? `<div class="list">${recent.slice(0,6).map(itemRow).join('')}</div>`
      : `<div class="empty">Noch nichts angelegt. Wähle ein Fach, erstelle eine Mappe (z. B. „Weimarer Republik“) und leg los – oder lass die KI einen Lernzettel schreiben.</div>`}`;
}

function itemRow({s,f,i}){
  const ic = ITEM_IC[i.type] || '📝';
  const sub = itemSub(i);
  return `<div class="row" onclick="go({view:'item',s:'${s.id}',f:'${f.id}',i:'${i.id}'})">
    <span class="ic">${ic}</span>
    <div class="t"><b>${esc(i.title)}</b><small><span class="dot" style="background:${s.color};margin-right:5px"></span>${esc(s.name)} › ${esc(f.name)} · ${sub} · ${fmtDate(i.updated)}</small></div>
  </div>`;
}

function examBanner(s){
  const ne = nextExamFor(s.id); if(!ne) return '';
  return `<div class="banner" style="--c:${s.color}">⏳ <b>${esc(ne.note||'Prüfung')}</b> am ${fmtExam(ne.at)} – noch <b data-cd="${ne.at}">${shortLeft(new Date(ne.at)-Date.now())}</b>
    <button class="btn small" style="margin-left:auto" onclick="createExam()">⏱ Probeklausur schreiben</button></div>`;
}

function viewSubject(){
  const s = getS(route.s); if(!s) return viewHome();
  return `
    ${crumbs([['Fächer',{view:'home'}],[kindLabel(s)+s.name]])}
    <div class="head">${menuBtn}<h1>${s.icon||''} ${esc(kindLabel(s)+s.name)}</h1>
      <button class="btn" onclick="createQuiz()">🧩 Quiz</button>
      <button class="btn" onclick="createExam()">⏱ Probeklausur</button>
      <button class="btn primary" onclick="newFolder('${s.id}')">＋ Neue Mappe</button>
    </div>
    ${aiStatusBox()}
    ${examBanner(s)}
    ${s.folders.length ? `<div class="grid">${s.folders.map(f => `
      <div class="card" style="--c:${s.color}" onclick="go({view:'folder',s:'${s.id}',f:'${f.id}'})">
        <div class="bar"></div>
        <div class="folder-ic">📁</div>
        <h3>${esc(f.name)}</h3>
        <div class="meta">${f.items.filter(i=>i.type==='note').length} Lernzettel · ${f.items.filter(i=>i.type==='cards').length} Kartensätze${f.items.some(i=>i.type==='quiz'||i.type==='exam')?` · ${f.items.filter(i=>i.type==='quiz'||i.type==='exam').length} Tests`:''}${f.files.length?` · ${f.files.length} Datei${f.files.length===1?'':'en'}`:''}</div>
      </div>`).join('')}</div>`
    : `<div class="empty">Noch keine Mappen in ${esc(s.name)}.<br>Lege eine Mappe pro Thema oder Semester an, z. B. „Q1 – Industrialisierung“.</div>`}`;
}

function viewFolder(){
  const s = getS(route.s), f = getF(s, route.f); if(!f) return viewSubject();
  const items = [...f.items].sort((a,b) => b.updated - a.updated);
  return `

/* ---------- Lernmodus: nicht gewusste Karten kommen erneut dran ---------- */
let session = null;
function startSession(i, onlyWrong){
  const pool = i.cards.map((c,k) => k).filter(k => ((i.cards[k].q||'').trim() || (i.cards[k].a||'').trim()) && (!onlyWrong || (i.cards[k].box||0) === 0));
  for(let a = pool.length-1; a > 0; a--){ const b = Math.floor(Math.random()*(a+1)); [pool[a],pool[b]] = [pool[b],pool[a]]; }
  session = {id:i.id, queue:pool, total:pool.length, right:0, wrong:0, flipped:false, missed:new Set()};
}
function learnView(i){
  const all = filled(i);
  if(!all.length) return `<div class="empty">Noch keine Karten. Wechsle zu „Karten bearbeiten“.</div>`;
  if(!session || session.id !== i.id) startSession(i, false);
  const known = all.filter(c => (c.box||0) > 0).length;
  const stats = `<p style="color:var(--muted)">Insgesamt gewusst: ${known} / ${all.length} Karten</p>`;
  if(!session.queue.length){
    return `<div class="learn"><div class="flip" style="cursor:default">🎉<br><b>Runde geschafft!</b><br><span style="font-size:15px;color:var(--muted)">Beim ersten Versuch gewusst: ${session.right} · wiederholt: ${session.wrong}</span></div>
      ${stats}<div class="actions"><button class="btn primary" onclick="restart(false)">Alle nochmal</button>
      ${known < all.length ? `<button class="btn" onclick="restart(true)">Nur Ungewusste</button>`:''}</div></div>`;
  }
  const c = i.cards[session.queue[0]];
  const done = session.total - session.queue.length;
  return `<div class="learn">
    <div class="progress"><div style="width:${session.total ? done/session.total*100 : 0}%"></div></div>
    <div style="color:var(--muted);font-size:13px;margin-bottom:10px">Noch ${session.queue.length} Karte${session.queue.length===1?'':'n'} in dieser Runde</div>
    <div class="flip" onclick="flipCard()" role="button" tabindex="0">
      <small>${session.flipped ? 'Antwort' : 'Frage'} · zum Umdrehen klicken / Leertaste</small>
      ${esc(session.flipped ? c.a : c.q)}
    </div>
    <div class="actions">${session.flipped
      ? `<button class="btn" style="color:var(--danger)" onclick="answer(false)">✗ Nicht gewusst (1)</button><button class="btn" style="color:var(--ok)" onclick="answer(true)">✓ Gewusst (2)</button>`
      : `<button class="btn primary" onclick="flipCard()">Antwort zeigen</button>`}</div>
    ${stats}
  </div>`;
}
function flipCard(){ if(!session?.queue.length) return; session.flipped = !session.flipped; render(); }
function answer(ok){
  const i = curItem(), k = session.queue.shift(), c = i.cards[k];
  if(ok){ if(!session.missed.has(k)) session.right++; c.box = Math.min((c.box||0)+1, 5); }
  else { if(!session.missed.has(k)) session.wrong++; session.missed.add(k); c.box = 0; session.queue.splice(Math.min(3, session.queue.length), 0, k); }
  session.flipped = false; save(); render();
}
function restart(onlyWrong){ startSession(curItem(), onlyWrong); render(); }

function viewSearch(){
  const q = query.trim().toLowerCase(), hits = [];
  state.subjects.forEach(s => s.folders.forEach(f => f.items.forEach(i => {

    if(txt.includes(q) || f.name.toLowerCase().includes(q)) hits.push({s,f,i});
  })));
  const fileHits = [];
  state.subjects.forEach(s => s.folders.forEach(f => f.files.forEach(x => {
    if((x.name + ' ' + x.text).toLowerCase().includes(q)) fileHits.push(`<div class="row" onclick="go({view:'folder',s:'${s.id}',f:'${f.id}'})">
      <span class="ic">${FILE_IC[x.kind]||'📄'}</span><div class="t"><b>${esc(x.name)}</b><small><span class="dot" style="background:${s.color};margin-right:5px"></span>${esc(s.name)} › ${esc(f.name)} · Datei</small></div></div>`);
  })));
  return `<div class="head">${menuBtn}<h1>Suche: „${esc(query)}“</h1></div>
    ${hits.length || fileHits.length ? `<div class="list">${hits.map(itemRow).join('')}${fileHits.join('')}</div>` : `<div class="empty">Keine Treffer.</div>`}`;
}

function subjectContext(s){
  const kinds = {LK:'Leistungskurs (erhöhtes Anforderungsniveau)', P4:'4. Prüfungsfach im Abitur (schriftlich)', P5:'5. Prüfungsfach im Abitur (Präsentation/mündlich)'};
  const ne = nextExamFor(s.id);
  return `Ich bin Schüler/in der gymnasialen Oberstufe in Deutschland und bereite mich aufs Abitur vor.
Fach: ${s.name}${s.kind ? ' – ' + kinds[s.kind] : ' (Grundkurs)'}.` + (ne ? `\nMeine nächste Prüfung in diesem Fach ist am ${fmtExam(ne.at)}.` : '');
}
const langRule = s => s.name === 'Englisch'
  ? 'Schreibe den Inhalt auf Englisch (Fachbegriffe ggf. mit deutscher Übersetzung in Klammern).'
  : 'Schreibe auf Deutsch.';
const FORMAT = `FORMAT – halte dich genau daran, denn der Text wird von einer einfachen Anzeige dargestellt:
- "# Titel" genau einmal ganz oben
- "## Abschnitt" und "### Unterabschnitt" für die Gliederung
- "- " für Stichpunkte, "1. " für Abfolgen
- **fett** für Schlüsselbegriffe, ==markiert== nur für das Allerwichtigste (sparsam), *kursiv* für Beispiele
- "> " am Zeilenanfang für einen kurzen Merksatz (wird als Merkkasten angezeigt; je Abschnitt höchstens einer)
- Tabellen als | Spalte | Spalte | mit Kopfzeile und Trennzeile |---|---|, z. B. für Zeitleisten oder Vergleiche
- Keine verschachtelten Listen, keine Codeblöcke, keine Links, keine Emojis
- Keine Einleitung wie "Hier ist…" und keine Schlussbemerkung – nur der Lernzettel selbst.`;

function notePrompt({s, topic, material, size, extra, copy, nImages = 0}){
  const imgNote = nImages ? `\nAngehängt sind außerdem ${nImages} Bild${nImages===1?'':'er'} (Fotos oder eingescannte Seiten meines Materials) – lies sie genau und nutze ihren Inhalt.` : '';
  if(copy) return `${subjectContext(s)}

Übertrage mein Material unten vollständig in einen gut lesbaren Lernzettel mit dem Titel "${topic}".
- Nichts Inhaltliches weglassen und nichts dazuerfinden: alle Fakten, Daten, Beispiele, Definitionen, Formeln und Aufgaben übernehmen.
- Nur sauber gliedern, in Stichpunkte/Tabellen bringen, offensichtliche Tipp- und Rechtschreibfehler korrigieren.
- Unwichtiges wie Seitenzahlen, Kopf-/Fußzeilen und Namen auf Arbeitsblättern weglassen.
- Behalte die Sprache des Materials bei.
- Füge KEINEN Abschnitt mit Prüfungsfragen hinzu, außer das Material enthält selbst Aufgaben.
${extra ? 'Zusätzliche Wünsche: ' + extra : ''}${imgNote}

${FORMAT}${material ? `\n\nMEIN MATERIAL:\n"""\n${material}\n"""` : ''}`;

const QTYPES = {mc:'Multiple Choice', gap:'Lückentext', tf:'Wahr/Falsch'};
function quizPrompt({s, material, n, types, lvl}){
  return `${subjectContext(s)}

Erstelle ein Quiz mit genau ${n} Fragen aus meinem Material unten.
Fragetypen: ${types.map(t => QTYPES[t]).join(', ')} – gemischt und ungefähr gleich verteilt.
Niveau: ${lvl === 'abi' ? 'Abitur-Niveau: auch Zusammenhänge, Ursachen/Folgen und Anwendung abfragen, nicht nur Fakten' : 'Grundlagen: zentrale Begriffe, Fakten und Definitionen'}.

Regeln:
- Nur Inhalte, die im Material stehen. Nichts erfinden.
- Multiple Choice ("mc"): genau 4 Antwortmöglichkeiten, genau eine richtig. Falsche Antworten plausibel (typische Verwechslungen), nicht absurd. Keine "Alle genannten"-Optionen.
- Wahr/Falsch ("tf"): eine Aussage. Etwa die Hälfte falsch; falsche Aussagen nur in einem wichtigen Detail verändert.
- Lückentext ("gap"): ein bis zwei Sätze mit 1–3 Lücken. Jede Lücke steht als [[Lösung]] im Text. Andere richtige Schreibweisen mit | trennen, z. B. [[1923|Jahr 1923]]. Lücken nur für eindeutige Schlüsselbegriffe, Namen oder Zahlen.
- Zu jeder Frage eine kurze Erklärung (1–2 Sätze), warum die Lösung stimmt.
- Keine Frage doppelt.
${langRule(s)}

Antworte nur mit JSON:
{"questions":[
 {"type":"mc","q":"Frage","options":["…","…","…","…"],"correct":0,"explain":"…"},
 {"type":"tf","q":"Aussage","correct":true,"explain":"…"},
 {"type":"gap","text":"Satz mit [[Lösung]].","explain":"…"}
]}

MATERIAL:
"""
${material}
"""`;
}
function cleanQuiz(arr, allowed){
  const out = [];
  for(const q of Array.isArray(arr) ? arr : []){
    if(!q || !allowed.includes(q.type)) continue;
    const explain = String(q.explain ?? '').trim();
    if(q.type === 'mc'){
      const opts = arrS(q.options), c = Number(q.correct);
      if(!q.q || opts.length < 2 || !(c >= 0 && c < opts.length)) continue;
      const right = opts[c], sh = shuffle(opts);
      out.push({type:'mc', q:String(q.q), options:sh, correct:sh.indexOf(right), explain});
    } else if(q.type === 'tf'){
      if(!q.q) continue;
      out.push({type:'tf', q:String(q.q), correct: q.correct === true || /^(true|wahr|richtig)$/i.test(String(q.correct)), explain});
    } else if(q.type === 'gap'){
      const t = String(q.text || q.q || '');
      if(/\[\[[^\]]+\]\]/.test(t)) out.push({type:'gap', text:t, explain});
    }
  }
  return out;
}

/* Lückentext prüfen: tolerant bei Groß/Klein, Umlauten und kleinen Tippfehlern */
function normAns(t){
  return String(t).toLowerCase().replace(/ä/g,'ae').replace(/ö/g,'oe').replace(/ü/g,'ue').replace(/ß/g,'ss')
    .replace(/[^a-z0-9,]+/g,' ').replace(/(\d),(\d)/g,'$1.$2').replace(/,/g,' ').replace(/\s+/g,' ').trim();
}
function lev(a, b){
  const d = Array.from({length:a.length+1}, (_, k) => [k]);
  for(let j = 1; j <= b.length; j++) d[0][j] = j;
  for(let k = 1; k <= a.length; k++) for(let j = 1; j <= b.length; j++)
    d[k][j] = Math.min(d[k-1][j] + 1, d[k][j-1] + 1, d[k-1][j-1] + (a[k-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function gapMatch(given, answer){
  const g = normAns(given); if(!g) return false;
  return answer.split('|').some(alt => {
    const a = normAns(alt); if(g === a) return true;
    if(/\d/.test(a)) return false;               // Zahlen müssen genau stimmen
    return a.length >= 5 && lev(g, a) <= (a.length >= 10 ? 2 : 1);
  });
}
const gapSplit = text => text.split(/\[\[(.+?)\]\]/);
function quizSolution(q, html){
  if(q.type === 'mc') return html ? esc(q.options[q.correct]) : q.options[q.correct];
  if(q.type === 'tf') return q.correct ? 'Wahr' : 'Falsch';
  return gapSplit(q.text).map((p, k) => k % 2 ? (html ? `<b>${esc(p.split('|')[0])}</b>` : p.split('|')[0]) : (html ? esc(p) : p)).join('');
}
function quizQuestionText(q){
  if(q.type === 'gap') return gapSplit(q.text).map((p, k) => k % 2 ? '_____' : p).join('');
  return q.type === 'tf' ? 'Wahr oder falsch? ' + q.q : q.q;
}

function quizPlay(i){

        ${q.explain ? `<div class="hint">${esc(q.explain)}</div>` : ''}</div>`).join('')}</div>` : ''}</div>`;
  }
  const k = R.order[R.pos], q = i.questions[k], res = R.res;
  let body = '';
  if(q.type === 'mc'){
    body = `<div class="qq">${esc(q.q)}</div><div class="qopts">${q.options.map((o, j) => {
      const cls = R.checked ? (j === q.correct ? 'right' : j === res.given ? 'wrong' : '') : '';

    }).join('')}</div><div class="hint" style="margin-top:8px">Tasten 1–${q.options.length} wählen eine Antwort.</div>`;
  } else if(q.type === 'tf'){

      <button class="qopt ${cls(true)}" onclick="quizAnswer(true)" ${R.checked ? 'disabled' : ''}><b>W</b><span>Wahr</span></button>
      <button class="qopt ${cls(false)}" onclick="quizAnswer(false)" ${R.checked ? 'disabled' : ''}><b>F</b><span>Falsch</span></button></div>`;
  } else {
    let g = -1;

    }).join('')}</div>`;
  }
  const fb = R.checked ? `<div class="fb ${res.ok ? 'ok' : 'no'}"><b>${res.ok ? '✓ Richtig!' : '✗ Leider falsch.'}</b> ${esc(q.explain || '')}</div>` : '';
  const nav = R.checked ? `<button class="btn primary" id="qnext" onclick="quizNext()">${R.pos + 1 < n ? 'Weiter →' : 'Auswertung →'}</button>`
    : q.type === 'gap' ? `<button class="btn primary" onclick="quizAnswer()">Prüfen (Enter)</button>` : '';
  return `<div class="qwrap">
    <div class="progress"><div style="width:${R.pos / n * 100}%"></div></div>
    <div class="qmeta"><span>Frage ${R.pos + 1} von ${n}</span><span>✓ ${R.ok} richtig</span></div>
    <div class="quizcard"><div class="qtype">${QTYPES[q.type]}</div>${body}${fb}<div class="qnav">${nav}</div></div></div>`;
}
function quizAnswer(v){
  const i = curItem(), R = quizRun; if(!R || R.checked) return;
  const k = R.order[R.pos], q = i.questions[k];
  if(q.type === 'gap'){
    const given = [...document.querySelectorAll('.gapin')].map(el => el.value);
    if(given.every(x => !x.trim())){ toast('Füll die Lücken aus – oder tippe „?“, wenn du es nicht weißt.'); return; }
    const answers = gapSplit(q.text).filter((_, idx) => idx % 2);
    const gaps = answers.map((a, g) => gapMatch(given[g] || '', a));
    R.res = {given, gaps, ok:gaps.every(Boolean)};
  } else R.res = {given:v, ok: v === q.correct};
  R.checked = true;
  if(R.res.ok) R.ok++; else R.wrong.push(k);
  render();
}
function quizNext(){
  const i = curItem(), R = quizRun; if(!R?.checked) return;

}

    const m = l.match(/^##\s+(.*)/);

    else if(cur) cur.lines.push(l);

}

let dictation = null, micTarget = null, micBase = '';
const joinText = (a, b) => !a ? b.trimStart() : (/\s$/.test(a) || /^\s/.test(b)) ? a + b : a + ' ' + b;
const micButton = id => `<button type="button" class="btn small micbtn" data-t="${id}" onclick="toggleMic('${id}')">🎙 Sprechen</button>`;
if(inClaude) window.claude.use('dictation').then(d => {
  if(!d) return;
  dictation = d;
  d.onPartial(({text}) => { const el = micTarget && document.getElementById(micTarget); if(el) el.value = joinText(micBase, text); });
  d.onFinal(({text}) => {
    micBase = joinText(micBase, text);
    const el = micTarget && document.getElementById(micTarget);
    if(el){ el.value = micBase; el.dispatchEvent(new Event('input')); }
  });
  d.onState(({state}) => {
    document.querySelectorAll('.micbtn').forEach(b => {
      const on = state !== 'idle' && b.dataset.t === micTarget;
      b.textContent = on ? '⏹ Stopp' : '🎙 Sprechen'; b.classList.toggle('ai', on);
    });
  });
  render();
});
function toggleMic(id){
  if(!dictation) return;
  if(dictation.active()){ dictation.stop().catch(() => {}); return; }
  micTarget = id; micBase = document.getElementById(id)?.value || '';
  dictation.start().catch(e => {
    if(e?.code === 'not_granted'){ dictation = null; render(); toast('Mikrofon nicht erlaubt – du kannst weiter tippen.'); }

const MAX_TEXT = 120000;          // so viel Text geht höchstens an die KI
const MAX_FILE_TEXT = 100000;     // so viel Text wird je Datei gespeichert
const PDFJS = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/';
const MAMMOTH = 'https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js';
const scripts = {};
function loadScript(src){
  return scripts[src] ||= new Promise((res, rej) => {
    const el = document.createElement('script'); el.src = src; el.onload = res;
    el.onerror = () => { delete scripts[src]; rej(new Error('Bibliothek nicht ladbar')); };
    document.head.appendChild(el);
  });
}
async function pdfLib(){
  await loadScript(PDFJS + 'pdf.min.js');
  await loadScript(PDFJS + 'pdf.worker.min.js');   // läuft im Hauptfenster, kein Web Worker nötig
  window.pdfjsLib.GlobalWorkerOptions.workerSrc = PDFJS + 'pdf.worker.min.js';
  return window.pdfjsLib;
}
async function openPdf(blob){ const lib = await pdfLib(); return lib.getDocument({data: new Uint8Array(await blob.arrayBuffer())}).promise; }
async function extractPdf(file){
  const doc = await openPdf(file); let text = '', chars = 0;
  for(let p = 1; p <= doc.numPages; p++){
    const tc = await (await doc.getPage(p)).getTextContent();
    let page = '';
    for(const it of tc.items){ page += it.str + (it.hasEOL ? '\n' : ' '); }
    page = page.replace(/[ \t]+\n/g, '\n').replace(/\n{3,}/g, '\n\n').trim();
    chars += page.replace(/\s/g, '').length;
    text += (doc.numPages > 1 ? `\n[Seite ${p}]\n` : '') + page + '\n';
  }
  return {text: text.trim(), pages: doc.numPages, scanned: chars < 30 * doc.numPages};
}
async function renderPdfPages(blob, max, width = 1400){
  const doc = await openPdf(blob), out = [];
  for(let p = 1; p <= Math.min(doc.numPages, max); p++){
    const page = await doc.getPage(p), v1 = page.getViewport({scale:1});
    const vp = page.getViewport({scale: Math.min(2.5, width / v1.width)});
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height);
    await page.render({canvasContext: ctx, viewport: vp}).promise;
    out.push(await new Promise(r => c.toBlob(r, 'image/jpeg', .82)));
  }
  return out;
}
async function extractDocx(file){
  await loadScript(MAMMOTH);
  return (await window.mammoth.extractRawText({arrayBuffer: await file.arrayBuffer()})).value.replace(/\n{3,}/g, '\n\n').trim();
}
async function downscale(blob, max = 1600, q = .82){
  const bmp = await createImageBitmap(blob);
  const k = Math.min(1, max / Math.max(bmp.width, bmp.height));
  const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);
  const ctx = c.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, c.width, c.height); ctx.drawImage(bmp, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}
const toDataURL = blob => new Promise(r => { const fr = new FileReader(); fr.onload = () => r(fr.result); fr.readAsDataURL(blob); });
function fileKind(file){
  const ext = (file.name.split('.').pop() || '').toLowerCase();
  if(ext === 'pdf' || file.type === 'application/pdf') return 'pdf';
  if(ext === 'docx') return 'docx';
  if(['txt','md','csv'].includes(ext) || file.type.startsWith('text/')) return 'text';
  if(file.type.startsWith('image/') || ['jpg','jpeg','png','webp','gif'].includes(ext)) return 'image';
  return null;
}
const blobURL = x => x.assetId ? '/_blob/' + x.assetId : x.data || null;
async function getBlob(x){ const u = blobURL(x); if(!u) throw new Error('kein Original'); return (await fetch(u)).blob(); }

async function readFile(file){
  const kind = fileKind(file);
  if(!kind){ toast(`„${file.name}“: Dieses Format geht nicht. Speichere es als PDF und lade es dann hoch.`, 6000); return null; }
  if(file.size > 20 * 1024 * 1024){ toast(`„${file.name}“ ist größer als 20 MB.`, 6000); return null; }
  const x = {id:uid(), name:file.name, kind, size:file.size, added:Date.now(), text:'', pages:0};
  let store = file;
  if(kind === 'pdf'){ const r = await extractPdf(file); x.pages = r.pages; x.scanned = r.scanned; x.text = r.scanned ? '' : r.text; }
  else if(kind === 'docx') x.text = await extractDocx(file);
  else if(kind === 'text') x.text = (await file.text()).trim();
  else { store = await downscale(file, 2000, .85); x.size = store.size; }
  if(x.text.length > MAX_FILE_TEXT){ x.text = x.text.slice(0, MAX_FILE_TEXT); x.cut = true; }
  if(assets){
    try { x.assetId = (await assets.upload(store, kind === 'text' ? {contentType:'text/plain'} : undefined)).id; }
    catch(e){ /* unten: Ersatz ohne Cloud-Original */ }
  }
  if(!x.assetId){
    // Ohne Datei-Speicher: Bilder klein als Daten behalten, eingescannte PDFs als Seitenbilder
    if(kind === 'image') x.data = await toDataURL(await downscale(file, 1400, .75));
    if(kind === 'pdf' && x.scanned) x.pageImgs = await Promise.all((await renderPdfPages(file, 6, 1200)).map(toDataURL));
  }
  return x;
}

/* Material für die KI: Text direkt, Bilder und Scans als Bilder */
async function gatherFiles(chosen, extra){
  const parts = [], images = [], skipped = [];
  const max = imgLimits?.maxCount || 0, maxBytes = imgLimits?.maxInputBytes || Infinity;
  for(const x of chosen){
    if(x.text){ parts.push(`=== Datei: ${x.name} ===\n${x.text}`); continue; }
    if(x.kind === 'image' || (x.kind === 'pdf' && x.scanned)){
      if(!max){ skipped.push(x.name); continue; }
      let blobs = [];
      if(x.kind === 'image') blobs = [await getBlob(x)];
      else if(x.assetId) blobs = await renderPdfPages(await getBlob(x), Math.max(0, max - images.length));
      else blobs = await Promise.all((x.pageImgs || []).map(d => fetch(d).then(r => r.blob())));
      for(const b of blobs){ if(images.length < max && b.size <= maxBytes) images.push(b); else { skipped.push(x.name); break; } }
    }
  }
  let material = [extra, ...parts].filter(Boolean).join('\n\n');
  if(material.length > MAX_TEXT){
    material = material.slice(0, MAX_TEXT) + '\n[… Rest gekürzt]';
    toast('Das Material ist sehr lang – es wird nur der Anfang verwendet. Wähle weniger Dateien auf einmal.', 7000);
  }
  if(skipped.length) toast(`Nicht alle Bilder/Seiten konnten mit: ${[...new Set(skipped)].join(', ')}. Nutze „Text erkennen“ bei der Datei oder wähle weniger aus.`, 8000);
  return {material, images};
}

/* Datei ansehen & Aktionen */
function curFile(id){ return getF(getS(route.s), route.f)?.files.find(x => x.id === id); }
function closeModal(){ document.querySelector('.modal-bg')?.remove(); }
function viewFile(id){
  const x = curFile(id); if(!x) return;
  const url = blobURL(x);
  const scan = x.kind === 'image' || (x.kind === 'pdf' && x.scanned);
  const img = x.kind === 'image' && url ? `<img class="prev" src="${esc(url)}" alt="${esc(x.name)}">` : '';
  const txt = x.text ? `<div class="filetext">${esc(x.text.slice(0, 30000))}${x.text.length > 30000 || x.cut ? '\n\n[… gekürzt angezeigt]' : ''}</div>`
    : scan ? `<p>Diese Datei ist ein Bild bzw. eine eingescannte Seite. Die KI kann sie direkt lesen – oder du lässt mit „Text erkennen“ den Text abschreiben, dann ist er auch durchsuchbar.</p>` : `<p>Kein Text gefunden.</p>`;
  modal(x.name, `
    <p>${fileInfo(x)} · ${(x.size/1024/1024).toFixed(1)} MB · hinzugefügt am ${fmtDate(x.added)}</p>
    ${img}${txt}
    <div class="acts" style="justify-content:flex-start;margin-bottom:14px">
      <button type="button" class="btn small ai" onclick="closeModal();aiCreate(['${x.id}'])">✨ Lernzettel mit KI</button>
      ${x.text ? `<button type="button" class="btn small" onclick="closeModal();fileToNote('${x.id}')">📝 Ohne KI übernehmen</button>` : ''}
      ${!x.text && scan ? `<button type="button" class="btn small ai" onclick="closeModal();ocrFile('${x.id}')">✨ Text erkennen</button>` : ''}
      ${url ? `<button type="button" class="btn small" onclick="saveOriginal('${x.id}')">⬇ Original speichern</button>` : ''}
    </div>`, 'Schließen', {wide:true});
}
async function saveOriginal(id){
  const x = curFile(id); if(!x) return;
  try{
    const blob = await getBlob(x);
    if(inClaude){ if(!downloads) throw 0; await downloads.save({filename:x.name, data:blob}); }
    else { const a = document.createElement('a'); a.href = URL.createObjectURL(blob); a.download = x.name; a.click(); setTimeout(() => URL.revokeObjectURL(a.href), 1000); }
  } catch(e){ if(e?.code !== 'cancelled') toast('Das Original konnte nicht gespeichert werden.'); }
}
function fileToNote(id){
  const s = getS(route.s), f = getF(s, route.f), x = curFile(id); if(!x?.text) return;
  const title = x.name.replace(/\.[^.]+$/, '');
  const i = addItem(f, 'note', title, {content:`# ${title}\n\n${x.text}`});
  go({view:'item', s:s.id, f:f.id, i:i.id, mode:'read'}); toast('Als Lernzettel übernommen – mit „✨ Überarbeiten“ kannst du ihn ordnen lassen.', 5000);
}
async function ocrFile(id){
  if(!aiReady()) return;
  const x = curFile(id); if(!x) return;
  if(!imgLimits){ toast('Bilder können in dieser Ansicht nicht an die KI geschickt werden.'); return; }
  const signal = ai.start(`Die KI liest „${x.name}“…`);
  try{
    const {images} = await gatherFiles([x], '');
    if(!images.length) throw {code:'empty_completion'};
    const {text} = await sample(`Schreibe den gesamten Text auf ${images.length === 1 ? 'diesem Bild' : 'diesen ' + images.length + ' Seiten'} vollständig und wortgetreu ab (Arbeitsblatt, Buchseite, Tafelbild oder Mitschrift). Behalte Überschriften, Aufzählungen und Absätze als einfache Zeilen bei, Tabellen als | Spalte | Spalte |. Beschreibe Grafiken, Karten oder Diagramme in einer Zeile in eckigen Klammern. Gib nur den abgeschriebenen Text aus.`, {signal, modelTier:'default', images});
    x.text = text.slice(0, MAX_FILE_TEXT); x.ocr = true; save();
    ai.end(); toast('Text erkannt ✓'); viewFile(id);
  } catch(e){ ai.end(); toast(aiErr(e), 6000); }
}
async function deleteFile(id){
  const f = getF(getS(route.s), route.f), x = curFile(id); if(!x) return;
  if(!await confirmBox(`Datei „${x.name}“ löschen? Lernzettel, die daraus entstanden sind, bleiben erhalten.`)) return;
  if(x.assetId && assets) assets.delete(x.assetId).catch(() => {});
  f.files = f.files.filter(y => y !== x); save(); render();
}

render();
cloud.init();
</script>
